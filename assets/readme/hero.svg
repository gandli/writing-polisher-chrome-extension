<svg width="1200" height="300" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563eb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e40af;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e2e8f0;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="300" fill="url(#bgGradient)" rx="12" ry="12"/>
  
  <!-- Decorative pattern -->
  <g opacity="0.1">
    <circle cx="100" cy="50" r="30" fill="white"/>
    <circle cx="1100" cy="250" r="40" fill="white"/>
    <circle cx="200" cy="250" r="20" fill="white"/>
    <circle cx="1000" cy="80" r="25" fill="white"/>
  </g>
  
  <!-- Title -->
  <text x="60" y="100" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif" font-size="48" font-weight="700" fill="url(#textGradient)">
    writing-polisher
  </text>
  
  <!-- Subtitle -->
  <text x="62" y="145" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif" font-size="22" font-weight="400" fill="#bfdbfe">
    Pure browser-side Chinese spelling correction • Completely offline • ONNX Runtime Web
  </text>
  
  <!-- Badge area -->
  <g transform="translate(60, 190)">
    <rect width="180" height="36" rx="18" fill="rgba(255,255,255,0.15)"/>
    <text x="48" y="25" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif" font-size="14" font-weight="500" fill="white">
      100% Offline
    </text>
    <circle cx="22" cy="18" r="8" fill="#10b981"/>
  </g>
  
  <g transform="translate(260, 190)">
    <rect width="140" height="36" rx="18" fill="rgba(255,255,255,0.15)"/>
    <text x="40" y="25" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif" font-size="14" font-weight="500" fill="white">
      Privacy-first
    </text>
    <circle cx="22" cy="18" r="8" fill="#f59e0b"/>
  </g>
  
  <g transform="translate(420, 190)">
    <rect width="160" height="36" rx="18" fill="rgba(255,255,255,0.15)"/>
    <text x="44" y="25" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif" font-size="14" font-weight="500" fill="white">
      ONNX Runtime
    </text>
    <circle cx="22" cy="18" r="8" fill="#8b5cf6"/>
  </g>
  
  <title>writing-polisher-extension - Pure browser-side Chinese spelling correction</title>
