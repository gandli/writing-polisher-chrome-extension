<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="380" viewBox="0 0 1200 380"
     role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">writing-polisher-extension — 中文拼写纠错浏览器扩展</title>
  <desc id="hero-desc">编辑器风格首图：左侧标题区，右侧中文文本样例显示拼写错误标注和修正建议</desc>

  <defs>
    <!-- Background gradient: subtle editor dark -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1200" y2="380">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <!-- Text gradient for main title -->
    <linearGradient id="textGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <!-- Error underline gradient -->
    <linearGradient id="errorGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="50%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#f87171"/>
    </linearGradient>
    <!-- Correction bubble gradient -->
    <linearGradient id="bubbleGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="380" fill="url(#bgGrad)" rx="16"/>

  <!-- Editor gutter lines (left margin decoration) -->
  <g opacity="0.08" stroke="#64748b" stroke-width="1">
    <line x1="64" y1="0" x2="64" y2="380"/>
    <line x1="80" y1="0" x2="80" y2="380"/>
  </g>

  <!-- Line number column -->
  <g fill="#475569" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" opacity="0.3">
    <text x="46" y="76">1</text>
    <text x="46" y="108">2</text>
    <text x="46" y="140">3</text>
    <text x="46" y="172">4</text>
    <text x="46" y="204">5</text>
    <text x="46" y="236">6</text>
    <text x="46" y="268">7</text>
  </g>

  <!-- Title block -->
  <g transform="translate(100, 48)">
    <!-- Category pill -->
    <rect width="110" height="22" rx="11" fill="#3b82f6" opacity="0.2"/>
    <text x="20" y="16" fill="#60a5fa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="600" letter-spacing="0.5">CHROME EXTENSION</text>

    <!-- Project name -->
    <text x="0" y="72" fill="url(#textGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="42" font-weight="700">writing-polisher-extension</text>

    <!-- Description -->
    <text x="0" y="110" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17" font-weight="400">
      纯浏览器端中文拼写纠错 · 完全离线 · 文字不出浏览器
    </text>

    <!-- Feature pills -->
    <g transform="translate(0, 140)">
      <rect width="120" height="30" rx="15" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="26" y="21" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="500">100% Offline</text>
      <circle cx="14" cy="15" r="5" fill="#10b981"/>
    </g>
    <g transform="translate(135, 140)">
      <rect width="130" height="30" rx="15" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="28" y="21" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="500">ONNX Runtime</text>
      <circle cx="16" cy="15" r="5" fill="#3b82f6"/>
    </g>
    <g transform="translate(280, 140)">
      <rect width="120" height="30" rx="15" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="26" y="21" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="500">Privacy-first</text>
      <circle cx="14" cy="15" r="5" fill="#f59e0b"/>
    </g>

    <!-- Metadata -->
    <text x="0" y="210" fill="#475569" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">
      MIT · 148KB gzipped · TypeScript · WXT
    </text>
  </g>

  <!-- Right side: Chinese text sample with error annotation -->
  <g transform="translate(620, 44)">
    <!-- Text editor panel -->
    <rect width="520" height="292" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>

    <!-- Editor tab bar -->
    <rect x="0" y="0" width="520" height="32" rx="10" fill="#1e293b"/>
    <rect x="0" y="16" width="520" height="16" fill="#1e293b"/>
    <rect x="12" y="4" width="100" height="24" rx="4" fill="#334155"/>
    <text x="22" y="20" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11">sample.txt</text>
    <circle cx="12" cy="16" r="4" fill="#ef4444" opacity="0.4"/>
    <circle cx="24" cy="16" r="4" fill="#eab308" opacity="0.4"/>
    <circle cx="36" cy="16" r="4" fill="#22c55e" opacity="0.4"/>

    <!-- Chinese text line 1 (correct) -->
    <text x="20" y="80" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Segoe UI', sans-serif" font-size="16" font-weight="400">
      今天天气很好，适合出去走走。
    </text>

    <!-- Chinese text line 2 (with error) -->
    <text x="20" y="112" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Segoe UI', sans-serif" font-size="16" font-weight="400">
      这篇文<text fill="#f87171" font-weight="500">章</text>写得非常<text fill="#f87171" font-weight="500">捧</text>，值得仔细阅读。
    </text>

    <!-- Error underlines (wavy) -->
    <path d="M260,124 Q266,130 272,124 Q278,118 284,124" fill="none" stroke="#ef4444" stroke-width="1.5"/>
    <path d="M374,124 Q380,130 386,124 Q392,118 398,124" fill="none" stroke="#ef4444" stroke-width="1.5"/>

    <!-- Correction suggestion bubble (for 捧) -->
    <g transform="translate(360, 140)">
      <!-- Arrow -->
      <polygon points="14,-4 8,8 20,8" fill="#334155"/>
      <!-- Bubble -->
      <rect x="0" y="8" width="140" height="52" rx="6" fill="url(#bubbleGrad)" stroke="#475569" stroke-width="1"/>
      <text x="12" y="24" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="10">
        建议修正
      </text>
      <!-- Suggestion item 1 (correct) -->
      <rect x="12" y="30" width="36" height="22" rx="4" fill="#10b981"/>
      <text x="22" y="46" fill="#fff" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="13" font-weight="500">棒</text>
      <!-- Suggestion item 2 -->
      <rect x="54" y="30" width="36" height="22" rx="4" fill="#334155" stroke="#475569" stroke-width="1"/>
      <text x="64" y="46" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="13">捧</text>
      <!-- Suggestion item 3 -->
      <rect x="96" y="30" width="36" height="22" rx="4" fill="#334155" stroke="#475569" stroke-width="1"/>
      <text x="106" y="46" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="13">朋</text>
    </g>

    <!-- Chinese text line 3 -->
    <text x="20" y="200" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Segoe UI', sans-serif" font-size="16" font-weight="400">
      他<text fill="#f87171" font-weight="500">的</text>工作能力很强，大家都很信任他。
    </text>
    <!-- Error underline for 的 (should be 的→地) -->
    <path d="M40,212 Q46,218 52,212 Q58,206 64,212" fill="none" stroke="#f59e0b" stroke-width="1.5"/>

    <!-- Status bar at bottom -->
    <rect x="0" y="260" width="520" height="32" rx="0 0 10 10" fill="#1e293b"/>
    <text x="16" y="282" fill="#475569" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">
      拼写错误: 3 · LN 2 / COL 8 · UTF-8 · ONNX Inference Engine
    </text>
  </g>
</svg>
