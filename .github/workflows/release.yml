# 🚀 Automated release - build, test, and publish extension

name: release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test

      - name: Build extension
        run: npm run build

      - name: Zip output
        run: |
          cd .output/chrome-mv3
          zip -r ../../writing-polisher-extension.zip .

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            writing-polisher-extension.zip
          generate_release_notes: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}